name: Build OSPE

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Retarget .NET Framework to 4.8
      shell: powershell
      run: |
        [xml]$proj = Get-Content OSPE.csproj
        foreach ($node in $proj.GetElementsByTagName("TargetFrameworkVersion")) {
            $node.InnerText = "v4.8"
        }
        foreach ($node in $proj.GetElementsByTagName("TargetFrameworkProfile")) {
            $node.ParentNode.RemoveChild($node)
        }
        $proj.Save("$PWD\OSPE.csproj")

    - name: Build x86 (Release)
      run: msbuild OSPE.sln /p:Configuration=Release /p:Platform=x86

    - name: Build x64 (Release)
      run: msbuild OSPE.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OSPE-Compiled-Binaries
        path: |
          **/Release/
